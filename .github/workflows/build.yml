name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel older runs on the same ref so we don't spend build minutes on
# superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # windows-latest already has the MSVC linker and WebView2 runtime.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The expensive part: reuse compiled dependencies across runs.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      # tauri build runs `beforeBuildCommand` (npm run ui:build) and produces
      # the NSIS setup exe under src-tauri/target/release/bundle/nsis/.
      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Verlox-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Tag a commit as v<version> (e.g. v2.0.0) to create a draft release.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*.exe
